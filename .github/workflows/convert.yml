name: Convert TXT to JSON

on:
  push:
    branches: [ main ] # Runs automatically on push to main branch
  workflow_dispatch:   # Allows you to trigger it manually from the Actions tab

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run conversion script
        run: python convert.py

      - name: Commit and push generated JSON
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add frequency-list.json
          git diff-index --quiet HEAD || git commit -m "Auto-generate frequency-list.json"
          git push
